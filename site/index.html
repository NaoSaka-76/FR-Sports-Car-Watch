<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FR Sports Car Watch</title>
<meta name="description" content="トヨタ GRスープラ(A90/A91・GT4・GT500)とライバルFRスポーツカーの公式リリース・トピックス・YouTube動画・歴代モデル・モータースポーツ情報を30分毎に自動収集するモニタリングダッシュボード" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2314100c'/%3E%3Cpath d='M16 5 L27 12 L27 20 L16 27 L5 20 L5 12 Z' fill='none' stroke='%23ff7a1a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5.4' fill='none' stroke='%23ff7a1a' stroke-width='1.6'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead__flag" aria-hidden="true"></div>
  <div class="masthead__inner">
    <div class="masthead__title-row">
      <div class="masthead__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 3 L29 10.5 L29 21.5 L16 29 L3 21.5 L3 10.5 Z" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="16" r="1.6" fill="currentColor"/></svg>
      </div>
      <div class="masthead__title">
        <span class="masthead__eyebrow">TOYOTA GR SUPRA — FR SPORTS CAR MONITORING</span>
        <h1>FR SPORTS CAR <span class="masthead__title-accent">WATCH</span></h1>
      </div>
    </div>
    <div class="masthead__status">
      <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-toggle__btn is-active" data-lang="ja">日本語</button>
        <button type="button" class="lang-toggle__btn" data-lang="en">English</button>
      </div>
      <div class="status-row">
        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
        <span id="last-updated">読み込み中…</span>
      </div>
      <div class="schedule-chips">
        <span class="chip" id="update-interval-chip">30分毎</span>
        <span class="chip-label" id="chip-label">JST 自動更新</span>
      </div>
    </div>
  </div>
</header>

<section class="stats" id="stats" aria-label="本日のサマリー"></section>

<main class="board" id="board">
  <p class="board__loading" id="loading">データを取得しています…</p>
</main>

<footer class="site-footer">
  <p id="footer-text"></p>
</footer>

<script src="app.js"></script>
<script data-goatcounter="https://naosaka.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
