name: Update FR Sports Car Watch Dashboard

on:
  schedule:
    # 30分毎(00分・30分)。GitHub Actionsのcronは実際には数分の遅延が生じることがある。
    - cron: "0,30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore headline translation cache
        # このワークフローはcontents:readのみでリポジトリへコミットバックしないため、
        # 見出し翻訳キャッシュ(scripts/.translation_cache.json)はactions/cacheで
        # 実行間を永続化する。keyはrun_id込みで常に新規(=毎回save対象)にし、
        # restore-keysのprefix一致で直前の実行のキャッシュを復元する。
        uses: actions/cache@v4
        with:
          path: scripts/.translation_cache.json
          key: translation-cache-${{ github.run_id }}
          restore-keys: |
            translation-cache-

      - name: Fetch FR Sports Car Watch dashboard data
        working-directory: scripts
        run: python fetch_data.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
